name: Update /life data

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so the deploy
  # is dispatched explicitly (workflow_dispatch is the allowed exception).
  actions: write

# Scheduled and manual runs must not race each other's push.
concurrency:
  group: update-life-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Spotify
        continue-on-error: true
        run: node scripts/fetch-spotify.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}

      - name: Steam
        continue-on-error: true
        run: node scripts/fetch-steam.mjs
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}

      - name: YouTube
        continue-on-error: true
        run: node scripts/fetch-youtube.mjs
        env:
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}

      - name: Letterboxd
        continue-on-error: true
        run: node scripts/fetch-letterboxd.mjs

      - name: Xbox
        continue-on-error: true
        run: node scripts/fetch-xbox.mjs
        env:
          XBOX_API_KEY: ${{ secrets.XBOX_API_KEY }}

      - name: Battle.net (WoW)
        continue-on-error: true
        run: node scripts/fetch-bnet.mjs
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}

      - name: MetaAds metrics (Metabase public card)
        continue-on-error: true
        run: node scripts/fetch-brendi-metrics.mjs
        env:
          METABASE_METRICS_URL: ${{ secrets.METABASE_METRICS_URL }}

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Every fetch bumps "updatedAt"; only commit when real data changed.
          if git diff --quiet -I '"updatedAt"' -- src/data/; then
            echo "No data changes (only timestamps) — skipping commit."
            git checkout -- src/data/
            exit 0
          fi
          git add src/data/spotify.json src/data/steam.json src/data/youtube.json src/data/letterboxd.json src/data/xbox.json src/data/wow.json src/data/brendi-metrics.json
          git commit -m "chore: refresh /life data"
          git pull --rebase origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
